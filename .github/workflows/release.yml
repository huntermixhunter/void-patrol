name: Build desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test the packaged Windows app
        if: runner.os == 'Windows'
        run: node tools/smoke.mjs "dist/win-unpacked/Void Patrol.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: void-patrol-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Download and play

            **Windows:** download the `VoidPatrol-Setup-....exe` file below and run it. It installs in a few seconds, adds Desktop and Start menu shortcuts, and opens the game. No admin rights needed. If Windows SmartScreen says "Windows protected your PC", click **More info**, then **Run anyway** (the installer is not code-signed).

            **Windows, no install:** the `Portable.exe` runs straight from wherever you save it.

            **Mac:** open the `.dmg` and drag Void Patrol to Applications. The first time, open it, then go to System Settings > Privacy & Security and click **Open Anyway**.

            **Linux:** mark the `.AppImage` executable and run it.

            **No download at all:** play in the browser at https://huntermixhunter.github.io/void-patrol/
